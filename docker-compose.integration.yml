version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  test_runner:
    build:
      context: .
      target: test
    environment:
      - NODE_ENV=test
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/testdb
      - RABBITMQ_HOST=amqp://rabbitmq:5672
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_ENDPOINT=http://localstack:4566
      - S3_BUCKET=docflow-test-bucket
      - QUEUE_NAME=file-processor-test
      - DB_NAME=docflow-test
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy