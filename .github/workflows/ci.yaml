name: CI

on:
    push: 
        branches:
            - development
    pull_request:
        branches:
            - development

jobs:
    integration-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Node JS environment
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test

